# worker/wrangler.toml —— Cloudflare Worker 同源后台（M0 骨架）
# 部署顺序刚性（全案 §4）：先 wrangler login + 部署本空壳拿 workers.dev 域名，
# 再注册 GitHub OAuth App（callback 指向本域名），最后回填 secrets。

name = "portfolio-backend"
main = "src/index.js"
compatibility_date = "2026-10-29"
account_id = "949775bf13d68a348e150d1d37ce6486"

# [vars] 仅放非敏感配置；敏感值（CLIENT_SECRET/PAT/JWT_SECRET）一律走
# `wrangler secret put`，禁止写进本文件（安全红线：零入库）。
# 已回填（2026-10-29）：站点域名 shanren4002.github.io；
# GITHUB_CLIENT_ID 来自用户注册的 OAuth App（公开信息，随 OAuth 链接传输）；
# ALLOWED_USERS = 上传白名单（user id，M3.5 生效；当前仅 shanren4002 一人）。
[vars]
ALLOWED_ORIGIN = "https://shanren4002.github.io"
GITHUB_CLIENT_ID = "Ov23lijqsOF9BX5xnW8S"
ALLOWED_USERS = "213465035"
GITHUB_REPO = "shanren4002/shanren4002.github.io"

# M3.5：OAuth state（一次性防 CSRF）+ 登录失败计数（满 5 次锁 15 分钟）
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "f877423034b947478b26836cec7865c2"

# M2+ 绑定自定义域（同源后台，无 CORS 面）后取消注释并回填：
# [[routes]]
# pattern = "api.<your-domain>"
# custom_domain = true
