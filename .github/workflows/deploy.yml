# .github/workflows/deploy.yml —— GitHub 个人作品集 CI/CD（双门禁 + Pages 部署）
# 与 phase3-release §1.3 对齐；I3 已增补配置类触发路径（eng v1.3 确认）
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
  workflow_dispatch:   # 手动触发：本地构建无法复现的问题排查、上线日最终发布、redeploy 降级路径

permissions:
  contents: read      # 工作流级最小权限；部署权限在下行 job 级单独授予

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false   # GitHub 官方 Pages 模板推荐：允许进行中的生产部署完成，
                              # 自动跳过排队中间态，只保留最新一次（详见 phase3-release §1.4）

jobs:
  build:
    name: 构建与门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # —— 阻断门禁 ①：内容契约预检（退出码非 0 即中止，不上线）——
      - name: 门禁① 内容预检（schema + 敏感信息 + 图片体积）
        run: python3 scripts/check_content.py

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # —— 阻断门禁 ②：构建（astro build + pagefind，Zod 构建期二次校验）——
      - name: 门禁② 构建（astro build + pagefind）
        run: pnpm build

      # —— 体积监控（软告警不阻断：仓库 >500MB 告警 / 单文件 >90MB 预警，100MB 为平台硬限）——
      - name: 体积监控（软告警）
        continue-on-error: true
        run: |
          GIT_SIZE=$(du -sm .git 2>/dev/null | cut -f1)
          WT_SIZE=$(du -sm --exclude=.git . | cut -f1)
          DIST_SIZE=$(du -sm dist | cut -f1)
          echo "::notice title=体积报告::.git=${GIT_SIZE}MB 工作区=${WT_SIZE}MB dist=${DIST_SIZE}MB（告警线 500MB / 软限 1GB）"
          if [ "$WT_SIZE" -gt 500 ] || [ "$GIT_SIZE" -gt 500 ]; then
            echo "::warning title=仓库体积超告警线::按 eng §十风险 2 预案处理：压缩图片 / 清理 archived 素材 / 评估外链"
          fi
          BIG=$(find . -path ./.git -prune -o -type f -size +90M -print | head -5)
          if [ -n "$BIG" ]; then
            echo "::warning title=大文件风险::发现 >90MB 文件（平台硬限 100MB）: $BIG"
          fi

      # —— 制品：唯一上线产物 ——
      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist    # Astro 默认输出目录（含 pagefind 索引）

  deploy:
    name: 部署 Pages
    needs: build      # 关键：构建/门禁失败则本 job 不会运行 → 线上保持上一可用版本
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:      # job 级最小权限：仅部署所需
      pages: write
      id-token: write
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
