<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 950" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 起点 -->
  <g>
    <rect x="40" y="16" width="280" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="180" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#412402">ProactiveService · _run()</text>
    <text x="180" y="50" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B" font-family="'JetBrains Mono',Consolas,monospace">每 10s 检查一次</text>
  </g>
  <path d="M180 64 L180 90" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- 决策 1 -->
  <g>
    <polygon points="180,94 320,128 180,162 40,128" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#042C53" font-family="'JetBrains Mono',Consolas,monospace">last_user_at 为空？</text>
  </g>
  <path d="M320 128 L424 128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="372" y="118" text-anchor="middle" font-size="11" fill="#5F5E5A">是</text>
  <g><rect x="430" y="108" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="555" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">跳过 · 无用户消息</text></g>
  <path d="M180 162 L180 188" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="196" y="178" font-size="11" fill="#5F5E5A">否</text>

  <!-- 决策 2 -->
  <g>
    <polygon points="180,192 320,226 180,260 40,226" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#042C53">空闲时长 &lt; 30s？</text>
  </g>
  <path d="M320 226 L424 226" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="372" y="216" text-anchor="middle" font-size="11" fill="#5F5E5A">是</text>
  <g><rect x="430" y="206" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="555" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">跳过 · 用户刚活跃</text></g>
  <path d="M180 260 L180 286" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="196" y="276" font-size="11" fill="#5F5E5A">否</text>

  <!-- 决策 3 -->
  <g>
    <polygon points="180,290 320,324 180,358 40,324" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#042C53" font-family="'JetBrains Mono',Consolas,monospace">已发送且 waiting/quiet？</text>
  </g>
  <path d="M320 324 L424 324" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="372" y="314" text-anchor="middle" font-size="11" fill="#5F5E5A">是</text>
  <g><rect x="430" y="304" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="555" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">跳过 · 等待回复中</text></g>
  <path d="M180 358 L180 384" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="196" y="374" font-size="11" fill="#5F5E5A">否</text>

  <!-- 决策 4 -->
  <g>
    <polygon points="180,388 320,422 180,456 40,422" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="422" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#042C53">冷却未满 40s？</text>
  </g>
  <path d="M320 422 L424 422" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="372" y="412" text-anchor="middle" font-size="11" fill="#5F5E5A">是</text>
  <g><rect x="430" y="402" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="555" y="422" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">跳过 · 冷却中</text></g>
  <path d="M180 456 L180 482" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="196" y="472" font-size="11" fill="#5F5E5A">否</text>

  <!-- 组装事件 -->
  <g>
    <rect x="40" y="486" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="504" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#042C53" font-family="'JetBrains Mono',Consolas,monospace">_ask_ai(idle_seconds)</text>
    <text x="180" y="524" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">事件 = 当前时间 + 空闲秒数 + 最近 12 条对话</text>
  </g>
  <path d="M180 542 L180 568" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- AI 决策 -->
  <g>
    <rect x="40" y="572" width="280" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="590" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#042C53">AI 决策（Function Calling）</text>
    <text x="180" y="609" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="'JetBrains Mono',Consolas,monospace">工具白名单：仅 send_proactive_message</text>
    <text x="180" y="626" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">不调用任何工具 = 不发送</text>
  </g>
  <path d="M180 636 L180 662" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- 决策 5 -->
  <g>
    <polygon points="180,666 320,700 180,734 40,700" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#042C53">返回发送工具调用？</text>
  </g>
  <path d="M320 700 L424 700" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="372" y="690" text-anchor="middle" font-size="11" fill="#5F5E5A">否</text>
  <g><rect x="430" y="680" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="555" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">quiet · 静默</text></g>
  <path d="M180 734 L180 760" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="196" y="750" font-size="11" fill="#5F5E5A">是</text>

  <!-- 决策 6 -->
  <g>
    <polygon points="180,764 320,798 180,832 40,798" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="180" y="794" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#042C53">分发器放行？</text>
    <text x="180" y="812" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#185FA5">去重 · 限频</text>
  </g>
  <path d="M320 798 L424 798" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="372" y="788" text-anchor="middle" font-size="11" fill="#5F5E5A">否</text>
  <g><rect x="430" y="778" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="555" y="798" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">quiet · 静默</text></g>
  <path d="M180 832 L180 858" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="196" y="848" font-size="11" fill="#5F5E5A">是</text>

  <!-- 终点 -->
  <g>
    <rect x="40" y="862" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="180" y="880" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">发送消息</text>
    <text x="180" y="899" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">状态置 waiting · 未回复最多一条</text>
  </g>

  <text x="40" y="938" font-size="11" fill="#5F5E5A">「要不要主动说话」由 AI 决策而非规则——不发送（quiet）也是合法输出，不会因时间经过而机械发送。</text>
</svg>
