<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif" role="img" aria-label="三策略问答路由与澄清降级流程：full_read、summary、adaptive 三策略共用同一回答函数，adaptive 低置信度时澄清追问，增幅不足降级全量读取">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 用户输入 -->
  <g>
    <rect x="290" y="12" width="180" height="40" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="380" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">用户 query</text>
  </g>
  <path d="M380 52 L380 78" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 策略路由 -->
  <g>
    <rect x="290" y="82" width="180" height="44" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="380" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">策略路由</text>
    <text x="380" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">--strategy 参数</text>
  </g>

  <!-- 三条策略分支 -->
  <path d="M380 126 L140 160" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M380 126 L380 160" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M380 126 L620 160" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">指定</text>
  <text x="404" y="146" font-size="11" fill="#185FA5" font-family="'JetBrains Mono',Consolas,monospace">默认</text>
  <text x="610" y="146" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">指定</text>

  <!-- full_read -->
  <g>
    <rect x="40" y="164" width="200" height="56" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="140" y="184" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">full_read 全量</text>
    <text x="140" y="203" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">原文直接进上下文</text>
  </g>
  <!-- adaptive -->
  <g>
    <rect x="280" y="164" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="380" y="184" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#042C53">adaptive 自适应</text>
    <text x="380" y="203" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="'JetBrains Mono',Consolas,monospace">先分类，再选上下文</text>
  </g>
  <!-- summary -->
  <g>
    <rect x="520" y="164" width="200" height="56" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="620" y="184" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">summary 摘要</text>
    <text x="620" y="203" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">结构化摘要进上下文</text>
  </g>

  <!-- full_read / summary 沿画布边缘下行，汇入收敛横条（避开中下游框体） -->
  <path d="M140 220 L140 240 L24 240 L24 655 L120 655" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M620 220 L620 240 L736 240 L736 655 L640 655" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- adaptive：意图分类 -->
  <path d="M380 220 L380 252" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <g>
    <rect x="280" y="256" width="200" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="380" y="274" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#042C53">意图分类</text>
    <text x="380" y="292" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="'JetBrains Mono',Consolas,monospace">classify_query_intent</text>
  </g>

  <!-- 置信度判断 -->
  <path d="M380 304 L380 332" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <g>
    <rect x="280" y="336" width="200" height="44" rx="22" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="380" y="358" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">置信度 ≥ 70%？</text>
  </g>

  <!-- 左支：是 → 按意图选上下文 -->
  <path d="M280 358 L206 358 L206 412" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="240" y="348" text-anchor="middle" font-size="11" fill="#0F6E56" font-family="'JetBrains Mono',Consolas,monospace">是</text>
  <g>
    <rect x="106" y="416" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="206" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">按意图选上下文</text>
    <text x="206" y="453" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="'JetBrains Mono',Consolas,monospace">full_read / summary 二选一</text>
  </g>
  <path d="M206 468 L206 640" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 右支：否 → 澄清追问 -->
  <path d="M480 358 L554 358 L554 412" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="520" y="348" text-anchor="middle" font-size="11" fill="#854F0B" font-family="'JetBrains Mono',Consolas,monospace">否</text>
  <g>
    <rect x="454" y="416" width="200" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="554" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#412402">澄清追问</text>
    <text x="554" y="453" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B" font-family="'JetBrains Mono',Consolas,monospace">每 3 轮一批，重分类</text>
  </g>

  <!-- 增幅判断 -->
  <path d="M554 468 L554 494" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <g>
    <rect x="454" y="498" width="200" height="40" rx="20" fill="#FBF9F4" stroke="#854F0B" stroke-width="1"/>
    <text x="554" y="518" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#412402">本批增幅 ≥ 10pp？</text>
  </g>
  <!-- 是：回环到澄清 -->
  <path d="M454 518 L420 518 L420 442 L454 442" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="418" y="480" text-anchor="middle" font-size="11" fill="#0F6E56" font-family="'JetBrains Mono',Consolas,monospace">是</text>
  <!-- 否：降级 -->
  <path d="M554 538 L554 566" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="578" y="554" font-size="11" fill="#854F0B" font-family="'JetBrains Mono',Consolas,monospace">否</text>
  <g>
    <rect x="454" y="570" width="200" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="554" y="590" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#412402">降级 full_read</text>
  </g>
  <path d="M554 610 L554 640" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 收敛横条：统一回答 -->
  <g>
    <rect x="120" y="640" width="520" height="46" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1.4"/>
    <text x="380" y="657" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">统一 answer_query</text>
    <text x="380" y="675" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">三策略共用同一回答函数与指令</text>
  </g>
  <path d="M380 686 L380 712" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 输出报告 -->
  <g>
    <rect x="230" y="716" width="300" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="380" y="734" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">产出静态 HTML 报告</text>
    <text x="380" y="753" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7" font-family="'JetBrains Mono',Consolas,monospace">Token 与准确度 · 见图二</text>
  </g>
</svg>
