    <text x="524" y="108" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C3635">摘要生成</text>
  </g>
  <g>
    <rect x="600" y="76" width="136" height="44" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="668" y="91" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">final_answer</text>
    <text x="668" y="108" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C3635">最终回答</text>
  </g>

