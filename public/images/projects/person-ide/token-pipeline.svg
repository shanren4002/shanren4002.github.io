<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif" role="img" aria-label="Token 观测管线：每次 LLM 调用归属五阶段之一，record_response 读取响应 usage 字段，缺失时记 None 不估算为 0，条目累积进 Tracker，snapshot 即时计算总计与分阶段快照，最终渲染进报告的收入与准确度表格，真实运行数据为输入 7330、输出 2013、合计 9343 Token">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 入口：每一次 LLM 调用 -->
  <g>
    <rect x="280" y="12" width="200" height="40" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="380" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">每一次 LLM 调用</text>
  </g>

  <!-- 分发到五阶段 -->
  <path d="M380 52 L380 64" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
  <path d="M92 64 L668 64" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
  <path d="M92 64 L92 76" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M236 64 L236 76" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M380 64 L380 76" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M524 64 L524 76" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M668 64 L668 76" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 五阶段枚举 -->
  <g>
    <rect x="24" y="76" width="136" height="44" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
