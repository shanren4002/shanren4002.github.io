    <text x="370" y="379" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">TokenUsageSnapshot · 每次调用重新计算</text>
  </g>
  <path d="M300 392 L250 424" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M460 392 L510 424" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 两种视图 -->
  <g>
    <rect x="110" y="428" width="260" height="48" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="240" y="447" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#2C3635">total 总计</text>
    <text x="240" y="465" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">request_count · input · output · cache</text>
  </g>
  <g>
    <rect x="390" y="428" width="260" height="48" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="520" y="447" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#2C3635">by_stage 分阶段</text>
    <text x="520" y="465" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">MappingProxyType 只读映射</text>
  </g>
  <path d="M240 476 L240 508" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M520 476 L520 508" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 报告表格 -->
  <g>
    <rect x="110" y="512" width="540" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="185" y="528" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#534AB7">策略</text>
    <text x="330" y="528" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#534AB7">输入 Token</text>
    <text x="465" y="528" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#534AB7">输出 Token</text>
    <text x="590" y="528" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#534AB7">合计 Token</text>
    <path d="M110 538 L650 538" fill="none" stroke="#534AB7" stroke-width="0.8"/>
    <text x="185" y="556" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">自适应</text>
    <text x="330" y="556" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C" font-family="'JetBrains Mono',Consolas,monospace">7,330</text>
