    <text x="236" y="108" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C3635">澄清提问</text>
  </g>
  <g>
    <rect x="312" y="76" width="136" height="44" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="380" y="91" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">reclassification</text>
    <text x="380" y="108" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C3635">重分类</text>
  </g>
