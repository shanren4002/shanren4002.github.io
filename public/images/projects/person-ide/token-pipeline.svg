  </g>
  <path d="M380 216 L380 248" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 累积 -->
  <g>
    <rect x="180" y="252" width="380" height="52" rx="8" fill="#FBF9F4" stroke="#46648C" stroke-width="1"/>
    <text x="370" y="272" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C3635">TokenUsageTracker</text>
    <text x="370" y="291" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="'JetBrains Mono',Consolas,monospace">_entries · frozen TokenUsageEntry 不可变条目</text>
  </g>
  <path d="M380 304 L380 336" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

