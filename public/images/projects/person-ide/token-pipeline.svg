    <text x="590" y="556" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C" font-family="'JetBrains Mono',Consolas,monospace">9,343</text>
    <path d="M260 512 L260 570" fill="none" stroke="#534AB7" stroke-width="0.8"/>
    <path d="M400 512 L400 570" fill="none" stroke="#534AB7" stroke-width="0.8"/>
    <path d="M530 512 L530 570" fill="none" stroke="#534AB7" stroke-width="0.8"/>
    <path d="M110 570 L650 570" fill="none" stroke="#534AB7" stroke-width="0.8"/>
    <text x="380" y="585" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#534AB7" font-family="'JetBrains Mono',Consolas,monospace">2026-10-18 · notes.md · 置信度 75% · 上下文=总结</text>
