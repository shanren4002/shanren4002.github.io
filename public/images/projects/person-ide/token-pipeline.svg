  <path d="M668 120 L668 132" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M92 132 L668 132" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
  <path d="M380 132 L380 152" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

